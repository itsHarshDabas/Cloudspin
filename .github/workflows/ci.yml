name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    env:
      # On Windows the tests download mpv the same way a first run does.
      CLOUDSPIN_TEST_DOWNLOAD: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install mpv and ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mpv ffmpeg
      - name: Install mpv and ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install mpv ffmpeg
      - run: pip install -e ".[dev]"
      - run: pytest -q -rs
